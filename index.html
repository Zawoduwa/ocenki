<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Tracker Ocen</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #0e0e12;
  --surface: #16161d;
  --card: #1c1c26;
  --border: #2a2a38;
  --border-mid: #3a3a50;
  --accent: #7c6af7;
  --accent-dim: #3d3780;
  --accent-glow: rgba(124,106,247,0.15);
  --text: #e8e8f0;
  --text-2: #9090a8;
  --text-3: #555568;
  --green: #4ade80;
  --green-bg: rgba(74,222,128,0.1);
  --red: #f87171;
  --red-bg: rgba(248,113,113,0.1);
  --blue: #60a5fa;
  --blue-bg: rgba(96,165,250,0.1);
  --gold: #fbbf24;
  --gold-bg: rgba(251,191,36,0.1);
  --radius: 10px;
  --radius-lg: 16px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:14px;line-height:1.4;min-height:100vh;padding-bottom:2rem}

/* HEADER */
header{border-bottom:1px solid var(--border);padding:0 1rem;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--bg);z-index:10}
.logo{font-size:15px;font-weight:600;letter-spacing:-.01em;color:var(--text);display:flex;align-items:center;gap:8px}
.logo-dot{width:8px;height:8px;background:var(--accent);border-radius:50%}
#status-dot{width:8px;height:8px;border-radius:50%;background:var(--text-3)}
#status-dot.ok{background:var(--green)}
#status-dot.err{background:var(--red)}

/* MAIN */
main{max-width:960px;margin:0 auto;padding:1rem}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(2, 1fr);gap:8px;margin-bottom:1rem}
@media(min-width:600px){.stats{grid-template-columns:repeat(4, 1fr);gap:12px;margin-bottom:1.5rem}}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1rem}
.stat-label{font-size:11px;color:var(--text-2);margin-bottom:.3rem}
.stat-val{font-size:20px;font-weight:600}
@media(min-width:600px){.stat-val{font-size:26px}}
.stat-val.pos{color:var(--green)}
.stat-val.neg{color:var(--red)}
.stat-val.neu{color:var(--text)}
.stat-sub{font-size:11px;color:var(--text-3);margin-top:2px}

/* FILTER BAR */
.filter-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;margin-bottom:1rem;display:flex;gap:8px}
.filter-card .field{flex:1}

/* ADD FORM */
.add-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;margin-bottom:1rem}
.add-title{font-size:12px;font-weight:500;color:var(--text-2);margin-bottom:.75rem;letter-spacing:.02em}
.add-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field{display:flex;flex-direction:column;gap:4px}
.field.full{grid-column: span 2;}
.field label{font-size:10px;color:var(--text-3);letter-spacing:.04em}
.field input,.field select{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:8px;font-size:13px;color:var(--text);outline:none;height:38px;width:100%;font-family:inherit}
.field input:focus,.field select:focus{border-color:var(--accent)}

.btn{height:40px;padding:0 14px;border-radius:var(--radius);font-size:13px;font-weight:500;cursor:pointer;border:1px solid var(--border-mid);background:var(--surface);color:var(--text);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:inherit;width:100%}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;margin-top:4px}
.btn-pay{background:var(--green-bg);border-color:rgba(74,222,128,0.3);color:var(--green);width:100%;margin-bottom:1rem}

/* TABLE */
.table-header{display:flex;flex-direction:column;gap:8px;margin-bottom:.5rem}
@media(min-width:600px){.table-header{flex-direction:row;align-items:center;justify-content:space-between}}
.table-title{font-size:13px;font-weight:500;color:var(--text)}

/* RESPONSYWNA TABELA / KARTY NA TELEFON */
.table-wrap{border:1px solid var(--border);border-radius:var(--radius);background:var(--card);overflow:hidden}
table{width:100%;border-collapse:collapse;display:none}
@mediamin-width:768px

thead th{background:var(--surface);padding:10px 12px;text-align:left;font-size:11px;color:var(--text-3);border-bottom:1px solid var(--border)}
tbody tr{border-bottom:1px solid var(--border)}
tbody tr:last-child{border-bottom:none}
td{padding:10px 12px;font-size:13px;vertical-align:middle}

/* WIDOK LISTY KART NA MOBILE (ZAMIAST TABELI) */
.mobile-list{display:flex;flex-direction:column;gap:8px;padding:8px}
@media(min-width:768px){.mobile-list{display:none}}

.m-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.m-card.paid-item{opacity:.5;text-decoration:line-through}
.m-info{display:flex;flex-direction:column;gap:3px;flex:1;overflow:hidden}
.m-subj{font-weight:600;font-size:14px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-subtext{font-size:11px;color:var(--text-2)}
.m-right{display:flex;align-items:center;gap:10px}
.m-amount{font-weight:600;font-size:13px}
.m-amount.pos{color:var(--green)}
.m-amount.neg{color:var(--red)}

/* BADGES & BUTTONS */
.badge{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:6px;font-weight:600;font-size:12px}
.b1{background:var(--red-bg);color:var(--red)}
.b4{background:var(--blue-bg);color:var(--blue)}
.b5{background:var(--green-bg);color:var(--green)}
.b6{background:var(--gold-bg);color:var(--gold)}

.paid-tag{font-size:10px;background:var(--green-bg);color:var(--green);border-radius:4px;padding:2px 5px}
.empty{text-align:center;padding:2rem 1rem;color:var(--text-3);font-size:13px}
.del-btn{background:var(--red-bg);border:1px solid rgba(248,113,113,0.3);color:var(--red);padding:6px 10px;border-radius:var(--radius);font-size:11px;cursor:pointer;font-family:inherit}

/* TOAST */
#toast{position:fixed;bottom:1rem;left:1rem;right:1rem;margin:0 auto;background:var(--card);border:1px solid var(--border-mid);border-radius:var(--radius);padding:.75rem 1rem;font-size:12px;color:var(--text);box-shadow:0 8px 32px rgba(0,0,0,.5);transform:translateY(80px);opacity:0;transition:.25s;z-index:50;text-align:center;max-width:320px}
#toast.show{transform:translateY(0);opacity:1}
.error-msg{background:var(--red-bg);border:1px solid rgba(248,113,113,0.25);border-radius:var(--radius);padding:8px 12px;font-size:12px;color:var(--red);margin-bottom:1rem;display:none}
</style>
</head>
<body>

<header>
  <div class="logo"><div class="logo-dot"></div>Tracker Ocen</div>
  <div id="status-dot" title="Status bazy"></div>
</header>

<main>
  <div class="error-msg" id="err-msg"></div>

  <!-- STATS -->
  <div class="stats">
    <div class="stat">
      <div class="stat-label">Do wypłaty</div>
      <div class="stat-val neu" id="s-pending">—</div>
      <div class="stat-sub" id="s-pending-count">0 ocen</div>
    </div>
    <div class="stat">
      <div class="stat-label">Wypłacono</div>
      <div class="stat-val neu" id="s-paid">—</div>
      <div class="stat-sub" id="s-paid-count">0 wypłat</div>
    </div>
    <div class="stat">
      <div class="stat-label">Łącznie (miesiąc)</div>
      <div class="stat-val neu" id="s-total">—</div>
      <div class="stat-sub">wybrany okres</div>
    </div>
    <div class="stat">
      <div class="stat-label">W bazie</div>
      <div class="stat-val neu" id="s-count">—</div>
      <div class="stat-sub">wszystkie</div>
    </div>
  </div>

  <!-- FILTER -->
  <div class="filter-card">
    <div class="field">
      <label>MIESIĄC</label>
      <select id="filter-month" onchange="loadEntries()">
        <option value="01">Styczeń</option><option value="02">Luty</option>
        <option value="03">Marzec</option><option value="04">Kwiecień</option>
        <option value="05">Maj</option><option value="06">Czerwiec</option>
        <option value="07">Lipiec</option><option value="08">Sierpień</option>
        <option value="09">Wrzesień</option><option value="10">Październik</option>
        <option value="11">Listopad</option><option value="12">Grudzień</option>
      </select>
    </div>
    <div class="field">
      <label>ROK</label>
      <select id="filter-year" onchange="loadEntries()">
        <option>2024</option><option>2025</option><option selected>2026</option>
        <option>2027</option><option>2028</option><option>2029</option>
      </select>
    </div>
  </div>

  <!-- ADD FORM -->
  <div class="add-card">
    <div class="add-title">DODAJ NOWĄ OCENĘ</div>
    <div class="add-grid">
      <div class="field full">
        <label>PRZEDMIOT</label>
        <input id="f-subj" placeholder="np. Matematyka">
      </div>
      <div class="field">
        <label>DZIEŃ</label>
        <input id="f-day" type="number" min="1" max="31" placeholder="1-31">
      </div>
      <div class="field">
        <label>OCENA</label>
        <select id="f-grade">
          <option value="1">1 (-10 zł)</option>
          <option value="4">4 (+5 zł)</option>
          <option value="5">5 (+10 zł)</option>
          <option value="6">6 (+15 zł)</option>
        </select>
      </div>
      <div class="field">
        <label>MIESIĄC</label>
        <select id="f-month">
          <option value="01">Styczeń</option><option value="02">Luty</option>
          <option value="03">Marzec</option><option value="04">Kwiecień</option>
          <option value="05">Maj</option><option value="06">Czerwiec</option>
          <option value="07">Lipiec</option><option value="08">Sierpień</option>
          <option value="09">Wrzesień</option><option value="10">Październik</option>
          <option value="11">Listopad</option><option value="12">Grudzień</option>
        </select>
      </div>
      <div class="field">
        <label>ROK</label>
        <select id="f-year">
          <option>2024</option><option>2025</option><option selected>2026</option>
          <option>2027</option><option>2028</option><option>2029</option>
        </select>
      </div>
      <div class="field full">
        <label>UWAGI (opcjonalnie)</label>
        <input id="f-note" placeholder="Dodatkowe informacje">
      </div>
      <div class="field full">
        <button class="btn btn-primary" onclick="addEntry()">+ Dodaj Ocenę</button>
      </div>
    </div>
  </div>

  <!-- TABLE & MOBILE LIST -->
  <div class="table-header">
    <div class="table-title" id="table-title-label">Historia ocen</div>
  </div>
  
  <button class="btn btn-pay" onclick="wypłać()">💸 Wypłać nieprzesłane z tego miesiąca</button>

  <div class="table-wrap">
    <!-- Widok komputer (tabela) -->
    <table>
      <thead><tr>
        <th>PRZEDMIOT</th>
        <th>DATA</th>
        <th>OCENA</th>
        <th>KWOTA</th>
        <th>STATUS</th>
        <th>UWAGI</th>
        <th></th>
      </tr></thead>
      <tbody id="tbody-desktop"><tr><td colspan="7" class="loading">Ładowanie...</td></tr></tbody>
    </table>

    <!-- Widok telefon (karty) -->
    <div class="mobile-list" id="tbody-mobile">
      <div class="empty">Ładowanie...</div>
    </div>
  </div>
</main>

<div id="toast"></div>

<script>
// --- KONFIGURACJA SUPABASE ---
const SUPABASE_URL = 'https://ysxlvjuijmhzhonhthoz.supabase.co'; // <- TUTAJ WKLEJ SWÓJ URL
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlzeGx2anVpam1oemhvbmh0aG96Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4MTk1MjQsImV4cCI6MjEwNzM5NTUyNH0.J-iDsa0u_e5QO0DnyqeLygI0jebwQ6d0VMWhwshen-g'; // <- TUTAJ WKLEJ SWÓJ KLUCZ ANON

const MONTHS = {
  '01':'Styczeń','02':'Luty','03':'Marzec','04':'Kwiecień',
  '05':'Maj','06':'Czerwiec','07':'Lipiec','08':'Sierpień',
  '09':'Wrzesień','10':'Październik','11':'Listopad','12':'Grudzień'
};
const AMOUNTS = {1:-10,4:5,5:10,6:15};

let sb = null;

function toast(msg, dur=2800){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),dur);
}

function showError(msg){
  const el=document.getElementById('err-msg');
  el.textContent=msg;el.style.display=msg?'block':'none';
}

function setStatus(ok){
  const d=document.getElementById('status-dot');
  d.className='';d.classList.add(ok?'ok':'err');
}

async function initSupabase(){
  try{
    sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const {error}=await sb.from('grades').select('id').limit(1);
    if(error)throw error;
    setStatus(true);
    loadEntries();
  }catch(e){
    toast('Błąd połączenia z bazą', 4000);
    setStatus(false);
  }
}

async function loadEntries(){
  if(!sb)return;
  
  const selMonth = document.getElementById('filter-month').value;
  const selYear = document.getElementById('filter-year').value;

  const {data,error}=await sb.from('grades')
    .select('*')
    .eq('month', selMonth)
    .eq('year', selYear);

  if(error){showError('Błąd ładowania: '+error.message);return;}
  
  // Sortowanie numeryczne dni od 1 do 31
  const sortedData = (data || []).sort((a, b) => parseInt(a.day, 10) - parseInt(b.day, 10));
  const {count}=await sb.from('grades').select('*', {count: 'exact', head: true});

  showError('');
  renderViews(sortedData, selMonth, selYear, count||0);
}

function renderViews(rows, month, year, totalCount){
  document.getElementById('table-title-label').textContent = `Historia ocen za ${MONTHS[month]} ${year}`;
  
  const pending=rows.filter(r=>!r.paid);
  const paid=rows.filter(r=>r.paid);
  const pendSum=pending.reduce((a,r)=>a+r.amount,0);
  const paidSum=paid.reduce((a,r)=>a+r.amount,0);
  const total=pendSum+paidSum;

  const fmt=v=>(v>=0?'+':'')+v+' zł';
  const el=(id,v)=>{
    const e=document.getElementById(id);
    e.textContent=fmt(v);
    e.className='stat-val '+(v>0?'pos':v<0?'neg':'neu');
  };
  el('s-pending',pendSum);el('s-paid',paidSum);el('s-total',total);
  document.getElementById('s-pending-count').textContent=pending.length+' ocen';
  document.getElementById('s-paid-count').textContent=paid.length+' wypłat';
  document.getElementById('s-count').textContent=totalCount;

  const dtBody = document.getElementById('tbody-desktop');
  const mbList = document.getElementById('tbody-mobile');

  if(!rows.length){
    dtBody.innerHTML=`<tr><td colspan="7" class="empty">Brak wpisów za ${MONTHS[month]} ${year}</td></tr>`;
    mbList.innerHTML=`<div class="empty">Brak wpisów za ${MONTHS[month]} ${year}</div>`;
    return;
  }
  
  let dtHtml = '';
  let mbHtml = '';

  rows.forEach(r=>{
    const amt=r.amount;
    const amtStr=(amt>=0?'+':'')+amt+' zł';
    const amtClass=(amt>=0?'pos':'neg');
    const dayFormatted = r.day ? String(r.day).padStart(2, '0') : '01';
    const dateStr = `${dayFormatted}.${r.month}.${r.year}`;

    // Tabela (Desktop)
    dtHtml+=`<tr class="${r.paid?'paid-row':''}">
      <td>${r.subject}</td>
      <td style="color:var(--text-2);font-size:13px">${dateStr}</td>
      <td><span class="badge b${r.grade}">${r.grade}</span></td>
      <td class="amount ${amtClass}">${amtStr}</td>
      <td>${r.paid?'<span class="paid-tag">wypłacono</span>':''}</td>
      <td style="font-size:12px;color:var(--text-3);max-width:160px;overflow:hidden;text-overflow:ellipsis">${r.note||''}</td>
      <td><button class="del-btn" onclick="deleteEntry(${r.id})">usuń</button></td>
    </tr>`;

    // Karty (Mobile)
    mbHtml+=`<div class="m-card ${r.paid?'paid-item':''}">
      <div class="m-info">
        <div style="display:flex;align-items:center;gap:6px">
          <span class="badge b${r.grade}">${r.grade}</span>
          <span class="m-subj">${r.subject}</span>
        </div>
        <div class="m-subtext">${dateStr} ${r.note ? '• '+r.note : ''}</div>
        ${r.paid ? '<span style="font-size:10px;color:var(--green)">Wypłacono</span>' : ''}
      </div>
      <div class="m-right">
        <span class="m-amount ${amtClass}">${amtStr}</span>
        <button class="del-btn" onclick="deleteEntry(${r.id})">usuń</button>
      </div>
    </div>`;
  });

  dtBody.innerHTML = dtHtml;
  mbList.innerHTML = mbHtml;
}

async function addEntry(){
  if(!sb){toast('Brak połączenia z bazą');return;}
  const subj=document.getElementById('f-subj').value.trim();
  const day=document.getElementById('f-day').value.trim();
  if(!subj || !day){
    toast('Wpisz przedmiot i dzień!');
    return;
  }

  const month=document.getElementById('f-month').value;
  const year=document.getElementById('f-year').value;
  const grade=parseInt(document.getElementById('f-grade').value);
  const note=document.getElementById('f-note').value.trim();
  const amount=AMOUNTS[grade];

  const {error}=await sb.from('grades').insert({subject:subj,day,month,year,grade,amount,note,paid:false});
  if(error){toast('Błąd: '+error.message,3500);return;}
  
  document.getElementById('filter-month').value = month;
  document.getElementById('filter-year').value = year;

  document.getElementById('f-subj').value='';
  document.getElementById('f-note').value='';
  toast('Dodano ocenę!');
  loadEntries();
}

async function deleteEntry(id){
  if(!sb||!confirm('Usunąć tę ocenę?'))return;
  const {error}=await sb.from('grades').delete().eq('id',id);
  if(error){toast('Błąd usuwania',3000);return;}
  toast('Usunięto');loadEntries();
}

async function wypłać(){
  if(!sb)return;
  const selMonth = document.getElementById('filter-month').value;
  const selYear = document.getElementById('filter-year').value;

  const {data,error}=await sb.from('grades').select('id,amount').eq('paid',false).eq('month', selMonth).eq('year', selYear);
  if(error||!data||!data.length){toast('Brak nieopłaconych ocen w tym miesiącu');return;}
  
  const sum=data.reduce((a,r)=>a+r.amount,0);
  const ids=data.map(r=>r.id);
  const {error:e2}=await sb.from('grades')
    .update({paid:true,paid_at:new Date().toISOString(),note:'Wypłacono '+(sum>=0?'+':'')+sum+' zł'})
    .in('id',ids);
  if(e2){toast('Błąd wypłaty: '+e2.message,3000);return;}
  toast('Wypłacono '+sum+' zł za '+ids.length+' ocen!',3500);
  loadEntries();
}

window.addEventListener('DOMContentLoaded',()=>{
  const now=new Date();
  const d=String(now.getDate());
  const m=String(now.getMonth()+1).padStart(2,'0');
  const y=String(now.getFullYear());
  
  document.getElementById('f-day').value=d;
  document.getElementById('f-month').value=m;
  document.getElementById('f-year').value=y;
  document.getElementById('filter-month').value=m;
  document.getElementById('filter-year').value=y;

  initSupabase();
});
</script>
</body>
</html>
